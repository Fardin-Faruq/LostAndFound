version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: lost2found-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: lost2found
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - app-network

  # ── Express API Server ───────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lost2found-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/lost2found
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads_data:/usr/src/app/uploads
    ports:
      - '5000:5000'
    depends_on:
      - mongo
    networks:
      - app-network

  # ── React Client (served via nginx) ─────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lost2found-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - app-network

volumes:
  mongo_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
